<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTA SA - Sistema de Login</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">
                <h1>MTA SA</h1>
                <p>Sistema de Login</p>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('register')">Registro</button>
            </div>

            <!-- Tab Login -->
            <div id="login-tab" class="tab-content active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-username">Usuario</label>
                        <input type="text" id="login-username" placeholder="Ingresa tu usuario" required>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" placeholder="Ingresa tu contraseña" required>
                    </div>

                    <button type="submit" class="btn-submit">Iniciar Sesión</button>
                </form>
            </div>

            <!-- Tab Registro -->
            <div id="register-tab" class="tab-content">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="register-username">Usuario</label>
                        <input type="text" id="register-username" placeholder="Elige un usuario" required minlength="3">
                    </div>

                    <div class="form-group">
                        <label for="register-password">Contraseña</label>
                        <input type="password" id="register-password" placeholder="Elige una contraseña" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label for="register-password-confirm">Confirmar Contraseña</label>
                        <input type="password" id="register-password-confirm" placeholder="Confirma tu contraseña" required minlength="6">
                    </div>

                    <button type="submit" class="btn-submit">Registrarse</button>
                </form>
            </div>

            <!-- Mensaje de estado -->
            <div id="message" class="message"></div>
        </div>

        <!-- Fondo animado -->
        <div class="background">
            <div class="circle circle1"></div>
            <div class="circle circle2"></div>
            <div class="circle circle3"></div>
        </div>
    </div>

    <script src="assets/script.js"></script>
</body>
</html>
